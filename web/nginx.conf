server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Long-cache fingerprinted assets emitted by Vite (e.g. /assets/index-XXXX.js).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Other static files (fonts, images, manifest, etc.).
  location ~* \.(?:woff2?|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
  }

  # Never cache the SPA shell so deploys roll out instantly.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires off;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
