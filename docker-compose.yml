services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: falcon
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon}
    # Bind-mount on the host so a Docker reset (e.g. wiping Docker.raw to
    # reclaim disk) doesn't wipe the database. Override with FALCON_DATA_DIR
    # to point somewhere other than ./.data (e.g. an external SSD).
    volumes:
      - ${FALCON_DATA_DIR:-./.data}/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${FALCON_DATA_DIR:-./.data}/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FALCON_DB_DSN: postgres://falcon:${POSTGRES_PASSWORD:-falcon}@postgres:5432/falcon?sslmode=disable
      FALCON_REDIS_ADDR: redis:6379
      FALCON_LISTEN_ADDR: :8080
      FALCON_JWT_SECRET: ${FALCON_JWT_SECRET:-change-me-please-32-bytes-min-secret}
      FALCON_WORKER_TOKEN: ${FALCON_WORKER_TOKEN:-worker-shared-secret}
      FALCON_ADMIN_EMAIL: ${FALCON_ADMIN_EMAIL:-admin@falcon.local}
      FALCON_ADMIN_PASSWORD: ${FALCON_ADMIN_PASSWORD:-admin}
      FALCON_ARTIFACTS_DIR: /data/artifacts
    volumes:
      - ${FALCON_DATA_DIR:-./.data}/artifacts:/data/artifacts
    ports:
      - "8090:8080"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      FALCON_REDIS_ADDR: redis:6379
      FALCON_API_URL: http://api:8080
      FALCON_WORKER_TOKEN: ${FALCON_WORKER_TOKEN:-worker-shared-secret}
      FALCON_ARTIFACTS_DIR: /data/artifacts
      FALCON_KATANA_DEPTH: ${FALCON_KATANA_DEPTH:-3}
      FALCON_KATANA_CONCURRENCY: ${FALCON_KATANA_CONCURRENCY:-10}
      FALCON_KATANA_PARALLELISM: ${FALCON_KATANA_PARALLELISM:-10}
      FALCON_KATANA_RATE_LIMIT: ${FALCON_KATANA_RATE_LIMIT:-150}
      FALCON_PW_MAX_HOSTS: ${FALCON_PW_MAX_HOSTS:-100}
      FALCON_PW_MAX_PAGES_PER_HOST: ${FALCON_PW_MAX_PAGES_PER_HOST:-30}
      FALCON_PW_PAGE_TIMEOUT_SECONDS: ${FALCON_PW_PAGE_TIMEOUT_SECONDS:-20}
      FALCON_PW_INCLUDE_SUBDOMAINS: ${FALCON_PW_INCLUDE_SUBDOMAINS:-0}
    volumes:
      - ${FALCON_DATA_DIR:-./.data}/artifacts:/data/artifacts

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://10.10.10.3:8090}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

