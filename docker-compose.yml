# Core — api + web only. Stateless; redeploy freely without touching data.
# postgres/redis live in docker-compose.data.yml; worker in docker-compose.worker.yml.
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FALCON_DB_DSN: ${FALCON_DB_DSN:-postgres://falcon:falcon@10.10.10.3:5432/falcon?sslmode=disable}
      FALCON_REDIS_ADDR: ${FALCON_REDIS_ADDR:-10.10.10.3:6379}
      FALCON_LISTEN_ADDR: :8080
      FALCON_JWT_SECRET: ${FALCON_JWT_SECRET:-change-me-please-32-bytes-min-secret}
      FALCON_WORKER_TOKEN: ${FALCON_WORKER_TOKEN:-worker-shared-secret}
      FALCON_ADMIN_EMAIL: ${FALCON_ADMIN_EMAIL:-admin@falcon.local}
      FALCON_ADMIN_PASSWORD: ${FALCON_ADMIN_PASSWORD:-admin}
      FALCON_ARTIFACTS_DIR: /data/artifacts
    volumes:
      - falcon_artifacts:/data/artifacts
    ports:
      - "8090:8080"
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://10.10.10.3:8090}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  falcon_artifacts:
